<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sukoon</title>
<meta name="theme-color" content="#16243b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sukoon">
<style>
  :root {
    --navy: #1f2f4a; --navy-2: #2b4166; --amber: #e0a030;
    --bg: #e9edf2; --mine: #dbe7fb; --theirs: #ffffff; --ink: #1c2430; --muted: #6b7686; --line: #c9d1dc;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: var(--bg); font-size: 16px; }
  button, input, textarea { font: inherit; }
  .hidden { display: none !important; }

  /* Sign-in */
  #login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { width: 100%; max-width: 360px; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 6px 24px rgba(31,47,74,.12); }
  .card h1 { margin: 0 0 4px; font-size: 22px; color: var(--navy); }
  .card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .card label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  .card input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
  input:focus, textarea:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
  #who2 { display: flex; gap: 10px; }
  #who2 button { flex: 1; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-weight: 700; font-size: 17px; cursor: pointer; color: var(--ink); }
  #who2 button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .primary { width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 10px; background: var(--navy); color: #fff; font-weight: 600; cursor: pointer; }
  .primary:disabled { opacity: .6; }
  #loginErr { color: #b3261e; font-size: 14px; min-height: 20px; margin-top: 10px; overflow-wrap: anywhere; }

  /* Chat */
  #chat { height: 100%; height: 100dvh; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; background: var(--bg); }
  header { background: var(--navy); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 10px 10px 14px; display: flex; align-items: center; gap: 8px; border-bottom: 3px solid var(--amber); }
  .avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--amber); color: var(--navy); font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; margin-right: 4px; }
  header .grow { flex: 1; min-width: 0; }
  header .title { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .who.typing { color: var(--amber); opacity: 1; font-weight: 600; }
  header .who { font-size: 12px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbtn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .hbtn svg { width: 21px; height: 21px; }
  #bellBtn.on svg { stroke: var(--amber); }
  #bellBtn.on #bellSlash { display: none; }
  #logoutBtn { flex: none; background: transparent; border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 8px; padding: 6px 9px; font-size: 13px; cursor: pointer; }

  #selbar { background: var(--navy-2); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 12px 10px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 3px solid var(--amber); min-height: 63px; }
  #selbar b { flex: 1; font-size: 16px; }
  #selbar button { border: 1px solid rgba(255,255,255,.45); background: transparent; color: #fff; border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
  #selDelete { background: #c5221f !important; border-color: #c5221f !important; font-weight: 600; }
  #selDelete:disabled { opacity: .5; }
  .row.sel { background: rgba(224,160,48,.28); border-radius: 10px; }
  .selecting .rbtn { visibility: hidden; }
  #pinbar { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: #fff; border-bottom: 1px solid var(--line); padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--ink); }
  #pinbar svg { flex: none; width: 16px; height: 16px; }
  #pinbar span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pinbar em { flex: none; font-style: normal; color: var(--muted); }

  #list { flex: 1; overflow-y: auto; padding: 12px 10px 4px; -webkit-overflow-scrolling: touch; }
  .day { text-align: center; margin: 14px 0 10px; }
  .day span { background: #d5dbe4; color: #3c4756; font-size: 12px; padding: 4px 10px; border-radius: 999px; }
  .row { display: flex; margin: 4px 0; touch-action: pan-y; }
  .row.mine { justify-content: flex-end; }
  .bubble { max-width: 78%; min-width: 0; background: var(--theirs); border-radius: 14px 14px 14px 4px; padding: 8px 11px 6px; box-shadow: 0 1px 2px rgba(0,0,0,.08); cursor: pointer; }
  .mine .bubble { background: var(--mine); border-radius: 14px 14px 4px 14px; }
  .pending .bubble { opacity: .65; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.35; }
  .text a { color: #1a5fd0; text-decoration: underline; }
  .gone .bubble { cursor: default; }
  .gone .text { font-style: italic; color: var(--muted); font-size: 14px; }
  .time { font-size: 11px; color: var(--muted); text-align: right; margin-top: 3px; }
  .stat { margin-left: 6px; font-weight: 600; }
  .stat.seen { color: #1a73e8; }
  .pinmark { margin-right: 6px; }
  .pic { display: block; max-width: 100%; max-height: 300px; border-radius: 10px; margin: 2px 0 4px; cursor: zoom-in; }
  .picwait { width: 180px; height: 120px; border-radius: 10px; background: rgba(0,0,0,.07); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; margin: 2px 0 4px; }
  .file { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.08); border-radius: 10px; padding: 8px 10px; margin: 2px 0 4px; cursor: pointer; min-width: 180px; }
  .file svg { flex: none; width: 26px; height: 26px; }
  .file div { flex: 1; min-width: 0; }
  .file b { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file small { display: block; font-size: 12px; color: var(--muted); }
  #docbar { display: flex; align-items: center; gap: 10px; margin: 6px 10px 0; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
  #docbar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #docbar button { flex: none; border: 0; background: var(--soft); color: var(--soft-ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .voice { display: block; width: 240px; max-width: 100%; height: 40px; margin: 2px 0 4px; }
  .rbtn { flex: none; align-self: center; border: 0; background: none; padding: 6px; cursor: pointer; opacity: .55; }
  .rbtn svg { width: 18px; height: 18px; display: block; }
  .quote { border-left: 3px solid var(--amber); background: rgba(0,0,0,.06); border-radius: 6px; padding: 4px 8px; margin-bottom: 4px; font-size: 13px; cursor: pointer; }
  .quote b { display: block; color: var(--navy-2); font-size: 12px; }
  .quote span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; color: #3c4756; }
  .reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .reacts:empty { display: none; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 1px 7px; font-size: 14px; cursor: pointer; line-height: 1.5; }
  .chip.me { border-color: var(--amber); background: #fdf3df; }
  .chip small { font-size: 11px; color: var(--muted); margin-left: 3px; }
  .flash .bubble { animation: flash 1.4s; }
  @keyframes flash { 0%, 60% { box-shadow: 0 0 0 3px var(--amber); } 100% { box-shadow: 0 1px 2px rgba(0,0,0,.08); } }
  #older { display: block; margin: 4px auto 10px; border: 0; background: #d5dbe4; color: #3c4756; border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  #empty { text-align: center; color: var(--muted); margin-top: 40px; font-size: 14px; }
  #status { text-align: center; font-size: 12px; color: #b3261e; min-height: 16px; padding: 0 12px; overflow-wrap: anywhere; }

  #replybar { display: flex; align-items: center; gap: 10px; margin: 6px 10px 0; padding: 6px 10px; background: #fff; border-left: 3px solid var(--amber); border-radius: 8px; font-size: 13px; }
  #replybar .grow { flex: 1; min-width: 0; }
  #replybar b { display: block; color: var(--navy-2); font-size: 12px; }
  #replybar span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #3c4756; }
  #replybar button { flex: none; border: 0; background: none; font-size: 20px; line-height: 1; color: var(--muted); cursor: pointer; padding: 4px 6px; }
  #preview { padding: 8px 12px 0; display: flex; align-items: center; gap: 10px; }
  #preview img { height: 64px; border-radius: 8px; }
  #preview button { border: 0; background: #d5dbe4; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  #composer { display: flex; align-items: flex-end; gap: 5px; padding: 8px 8px calc(10px + env(safe-area-inset-bottom)); }
  #composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 22px; padding: 11px 14px; max-height: 120px; line-height: 1.3; background: #fff; }
  .round { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #micBtn, #stkBtn, #attBtn { background: #fff; border: 1px solid var(--line); }
  .round { width: 42px; height: 42px; }
  .round svg { width: 21px; height: 21px; }
  #sendBtn { background: var(--navy); }
  .round svg { width: 22px; height: 22px; }
  #recbar { display: flex; align-items: center; gap: 10px; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); }
  #recbar .dot { width: 12px; height: 12px; border-radius: 50%; background: #d93025; animation: blink 1s infinite; }
  #recbar .lbl { flex: 1; font-weight: 600; }
  #recbar button { border: 0; border-radius: 22px; padding: 11px 16px; cursor: pointer; font-weight: 600; }
  #recCancel { background: #d5dbe4; color: var(--ink); }
  #recSend { background: var(--navy); color: #fff; }
  @keyframes blink { 50% { opacity: .25; } }

  /* Overlays */
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; z-index: 30; cursor: zoom-out; }
  #viewer img { max-width: 100%; max-height: 100%; }
  .shade { position: fixed; inset: 0; background: rgba(15,23,36,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  #sheet .box, #attach .box, #stk .box { width: 100%; max-width: 760px; background: #fff; border-radius: 18px 18px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); }
  #emojis { display: flex; justify-content: space-between; margin-bottom: 10px; }
  #emojis button { border: 0; background: #f1f3f6; border-radius: 50%; width: 46px; height: 46px; font-size: 24px; cursor: pointer; }
  #emojis button.on { background: #fdf3df; box-shadow: inset 0 0 0 2px var(--amber); }
  .act { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 13px 6px; font-size: 16px; cursor: pointer; border-top: 1px solid #edf0f4; color: var(--ink); }
  #panel { align-items: stretch; }
  #panel .box { width: 100%; max-width: 760px; background: var(--bg); display: flex; flex-direction: column; }
  #panel .top { background: var(--navy); color: #fff; display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 10px 10px 16px; border-bottom: 3px solid var(--amber); }
  #panel .top b { flex: 1; font-size: 17px; }
  #panel .top button { border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  #searchForm { display: flex; gap: 8px; padding: 10px; }
  #searchForm input { flex: 1; min-width: 0; padding: 11px 14px; border: 1px solid var(--line); border-radius: 22px; }
  #searchForm button { border: 0; background: var(--navy); color: #fff; border-radius: 22px; padding: 0 16px; font-weight: 600; cursor: pointer; }
  #panelList { flex: 1; overflow-y: auto; padding: 4px 10px 16px; }
  .item { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 12px; padding: 10px 12px; margin: 6px 0; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .item .grow { flex: 1; min-width: 0; }
  .item small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  .item span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .item button { flex: none; border: 0; background: #edf0f4; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  .note { text-align: center; color: var(--muted); font-size: 14px; margin-top: 30px; padding: 0 20px; }
  /* Stickers */
  .row.stk .bubble { background: transparent; box-shadow: none; padding: 2px 4px; }
  .stkimg { display: block; width: 140px; height: 140px; object-fit: contain; cursor: pointer; }
  .text.big { font-size: 44px; line-height: 1.15; }
  #attach .act:first-child { border-top: 0; }
  #stk .box { max-height: 72vh; overflow-y: auto; }
  #stkTop { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #stkTop span { flex: 1; }
  #stkTop .tab { background: transparent !important; color: var(--muted) !important; font-size: 15px; font-weight: 700; padding: 7px 8px; border-bottom: 2px solid transparent; border-radius: 0; }
  #stkTop .tab.on { color: var(--ink) !important; border-bottom-color: var(--amber); }
  #stkTop button { border: 0; border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  #stkEdit.on { background: #c5221f !important; color: #fff !important; }
  #stkGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  #stkGrid button { position: relative; aspect-ratio: 1; border: 0; border-radius: 12px; padding: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; overflow: hidden; }
  #stkGrid img { width: 100%; height: 100%; object-fit: contain; }
  #stkGrid .add { font-size: 30px; border: 1px dashed var(--line); background: transparent; color: var(--muted); }
  #stkGrid.editing button:not(.add)::after { content: '\00D7'; position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; line-height: 20px; border-radius: 50%; background: #c5221f; color: #fff; font-size: 15px; }
  #stkNote { grid-column: 1 / -1; color: var(--muted); font-size: 13px; padding: 4px 2px; }
  #stkHead { margin: 14px 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  #emoGrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  #emoGrid button { border: 0; background: none; font-size: 30px; padding: 6px 0; cursor: pointer; border-radius: 10px; }

  /* GIF search */
  #gifForm { display: flex; gap: 8px; margin-bottom: 10px; }
  #gifForm input { flex: 1; min-width: 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 22px; }
  #gifForm button { border: 0; border-radius: 22px; padding: 0 16px; font-weight: 600; cursor: pointer; }
  #gifGrid { column-count: 2; column-gap: 8px; min-height: 120px; }
  #gifGrid button { display: block; width: 100%; margin: 0 0 8px; padding: 0; border: 0; border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--soft); break-inside: avoid; }
  #gifGrid img { display: block; width: 100%; height: auto; }
  #gifGrid .note { margin: 20px 0; column-span: all; }
  #gifCredit { text-align: center; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 0 2px; }
  .gifimg { width: 200px; max-height: none; }

  /* ---------- Dark mode ---------- */
  :root {
    color-scheme: dark;
    --navy: #16243b; --navy-2: #9db7e6; --amber: #e0a030;
    --bg: #0e141c; --mine: #1d4a7c; --theirs: #1c2735; --ink: #e7ecf3; --muted: #93a0b4; --line: #2e3b4e;
    --surface: #18222f; --soft: #243245; --soft-ink: #c3cddc;
  }
  .card, #pinbar, #replybar, #sheet .box, #attach .box, #stk .box, .item, .chip, #who2 button, #micBtn, #stkBtn, #attBtn, #docbar,
  #composer textarea, .card input, #searchForm input, #gifForm input { background: var(--surface); color: var(--ink); }
  .card { box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  .card h1 { color: var(--ink); }
  .day span, #older, #preview button, #recCancel, .item button, #emojis button, #stkTop button, #stkGrid button { background: var(--soft); color: var(--soft-ink); }
  .quote { background: rgba(255,255,255,.09); }
  .quote span, #replybar span { color: var(--soft-ink); }
  .picwait { background: rgba(255,255,255,.07); }
  .text a { color: #8ab8ff; }
  .stat.seen { color: #6cb0ff; }
  .chip.me, #emojis button.on { background: #3a2f14; }
  .act { border-top-color: #263244; }
  #loginErr, #status { color: #ff8a80; }
  #status.info { color: var(--soft-ink); }
  #sendBtn, .primary, #recSend, #searchForm button, #gifForm button, #who2 button.on { background: var(--amber); border-color: var(--amber); color: #14202f; }
  #selbar { background: #22395c; }
  .shade { background: rgba(0,0,0,.6); }
  .bubble { box-shadow: 0 1px 2px rgba(0,0,0,.35); }
  @keyframes flash { 0%, 60% { box-shadow: 0 0 0 3px var(--amber); } 100% { box-shadow: 0 1px 2px rgba(0,0,0,.35); } }
</style>
</head>
<body>

<div id="login" class="hidden">
  <form class="card" id="loginForm">
    <h1>Sukoon</h1>
    <p>Choose who you are and enter the passcode.</p>
    <label>Who are you?</label>
    <div id="who2"></div>
    <label for="passIn">Passcode</label>
    <input id="passIn" type="password" autocomplete="off" required>
    <button class="primary" id="loginBtn" type="submit">Enter chat</button>
    <div id="loginErr"></div>
  </form>
</div>

<div id="chat" class="hidden">
  <div id="selbar" class="hidden">
    <b id="selCount">1 selected</b>
    <button id="selCancel" type="button">Cancel</button>
    <button id="selDelete" type="button">Delete</button>
  </div>
  <header id="head">
    <div class="avatar" id="avatar">S</div>
    <div class="grow">
      <div class="title" id="title">Sukoon</div>
      <div class="who" id="who"></div>
    </div>
    <button class="hbtn" id="searchBtn" type="button" aria-label="Search messages">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <button class="hbtn" id="pinsBtn" type="button" aria-label="Pinned messages">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 3 3H7l3-3z"/><path d="M12 13v7"/></svg>
    </button>
    <button id="logoutBtn" type="button">Sign out</button>
  </header>
  <button id="pinbar" class="hidden" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="#e0a030" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 3 3H7l3-3z"/><path d="M12 13v7"/></svg>
    <span id="pinText"></span><em id="pinCount"></em>
  </button>
  <div id="list"></div>
  <div id="status"></div>
  <div id="replybar" class="hidden">
    <div class="grow"><b id="replyName"></b><span id="replyText"></span></div>
    <button id="replyCancel" type="button" aria-label="Cancel reply">&times;</button>
  </div>
  <div id="preview" class="hidden">
    <img id="previewImg" alt="Picture to send">
    <button id="removePic" type="button">Remove</button>
  </div>
  <div id="docbar" class="hidden">
    <span id="docName"></span>
    <button id="removeDoc" type="button">Remove</button>
  </div>
  <div id="composer">
    <button class="round" id="stkBtn" type="button" aria-label="Stickers and emoji">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c3cddc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><path d="M9 9.5v.5M15 9.5v.5"/></svg>
    </button>
    <textarea id="msgIn" rows="1" placeholder="Message" maxlength="4000"></textarea>
    <button class="round" id="attBtn" type="button" aria-label="Attach a picture or document">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c3cddc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.5 8.5a1.8 1.8 0 0 1-2.5-2.5l7.8-7.8"/></svg>
    </button>
    <button class="round" id="micBtn" type="button" aria-label="Record a voice message">

<script src="config.js"></script>
<script>
  var API = (window.CHAT_API || '').trim();
  var USERS = ['MH', 'JH'], pick = '';
  var KEEP = 500, EMOJIS = ['👍', '❤️', '😂', '😮', '😢', '🙏'];
  var me = '', pass = '', lastRow = 0, firstRow = 0, lastDay = '', busy = false, sending = false, timer = null;
  var pendingPic = '', picCache = {}, items = [], byId = {};
  var seenRow = 0, otherDelivered = 0, otherSeen = 0, otherName = '';
  var hotUntil = 0, wantPoll = false, queue = [], pendingEls = [];
  var stickers = null, stkEditing = false;
  // Key for the GIPHY GIF search (can also be set as window.GIPHY_KEY in config.js)
  var GIPHY_KEY = window.GIPHY_KEY || 'o9sMkdws363zYPGxDocg7RB3TNJJbMff', gifSeq = 0, gifLoaded = false;
  var BIG_EMOJI = ['\uD83D\uDE00','\uD83D\uDE02','\uD83E\uDD23','\uD83D\uDE0A','\uD83D\uDE0D','\uD83E\uDD70','\uD83D\uDE18','\uD83D\uDE0E','\uD83E\uDD14','\uD83D\uDE34','\uD83D\uDE2D','\uD83D\uDE21','\uD83D\uDE31','\uD83E\uDD73','\uD83D\uDE07','\uD83D\uDE48','\uD83D\uDC4D','\uD83D\uDC4E','\uD83D\uDC4F','\uD83D\uDE4F','\uD83D\uDCAA','\uD83E\uDD1D','\uD83D\uDC4B','\uD83E\uDD32','\u2764\uFE0F','\uD83D\uDC94','\uD83D\uDD25','\u2B50','\uD83C\uDF89','\uD83C\uDF39','\u2615','\uD83C\uDF19','\u2705','\u274C','\uD83D\uDCAF','\uD83C\uDF81'];
  var pendingFile = null, MAX_FILE = 10 * 1024 * 1024;
  var notifyOn = false, unread = 0, audioCtx = null;
  var typedAt = 0, typingSent = false, otherTyping = false;
  var swipe = null, swipedAt = 0;
  var selecting = false, selected = {}, delArmed = 0;
  var replyTo = null, loadingOlder = false, rv = null, pv = -1, pins = [], sheetMsg = null;

  function $(id) { return document.getElementById(id); }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function same(a, b) { return String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase(); }
  function isMe(name) { return same(name, me); }
  function errText(err) { return String(err && err.message || err); }

  // ---------- Talking to the Google script ----------
  function api(action, data) {
    if (!API || API.indexOf('https://') !== 0) {
      return Promise.reject(new Error('The app link is not set yet. Put your /exec link in config.js.'));
    }
    data = data || {};
    data.action = action;
    return fetch(API, { method: 'POST', body: JSON.stringify(data), redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok) throw new Error((j && j.error) || 'Unknown problem');
        return j.data;
      });
  }
  function isWrongPass(err) { var t = errText(err); return t.indexOf('WRONG_PASSCODE') !== -1 || t.indexOf('UNKNOWN_NAME') !== -1; }

  // ---------- Pictures and voice kept on this device so they open instantly ----------
  var dbP = null;
  function db() {
    if (dbP) return dbP;
    dbP = new Promise(function (res, rej) {
      try {
        var rq = indexedDB.open('sukoon-chat', 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore('pics'); };
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { rej(rq.error); };
      } catch (e) { rej(e); }
    });
    return dbP;
  }
  function picLoad(id) {
    return db().then(function (d) {
      return new Promise(function (res) {
        var rq = d.transaction('pics').objectStore('pics').get(id);
        rq.onsuccess = function () { res(rq.result || ''); };
        rq.onerror = function () { res(''); };
      });
    }).catch(function () { return ''; });
  }
  function picSave(id, src) {
    db().then(function (d) { d.transaction('pics', 'readwrite').objectStore('pics').put(src, id); }).catch(function () {});
  }
  function picWipe() {
    db().then(function (d) { d.transaction('pics', 'readwrite').objectStore('pics').clear(); }).catch(function () {});
  }

  // ---------- Sign in ----------
  function known(name) {
    var found = '';
    USERS.forEach(function (u) { if (same(u, name)) found = u; });
    return found;
  }
  function setPick(name) {
    pick = known(name);
    var bs = $('who2').children;
    for (var i = 0; i < bs.length; i++) bs[i].className = bs[i].textContent === pick ? 'on' : '';
  }
  USERS.forEach(function (u) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = u;
    b.addEventListener('click', function () { setPick(u); $('loginErr').textContent = ''; });
    $('who2').appendChild(b);
  });

  $('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var n = pick, p = $('passIn').value;
    if (!n) { $('loginErr').textContent = 'Please choose ' + USERS.join(' or ') + ' first.'; return; }
    if (!p) return;
    $('loginBtn').disabled = true;
    $('loginErr').textContent = '';
    api('getMessages', { pass: p, after: 0, name: '', seen: 0 }).then(function (res) {
      $('loginBtn').disabled = false;
      // Sides are decided by name, so keep to the names already used in this chat
      var names = (res.names || []).filter(Boolean), match = '';
      names.forEach(function (x) { if (same(x, n)) match = x; });
      if (!match && names.length >= 2) {
        $('loginErr').textContent = 'This chat already has: ' + names.join(', ') + '. Please type your name exactly as one of these.';
        return;
      }
      me = match || n; pass = p;
      store('chatName', me); store('chatPass', p);
      openChat();
      resetList();
      addMessages(res, true);
      startPolling();
      poll();
    }).catch(function (err) {
      $('loginBtn').disabled = false;
      $('loginErr').textContent = isWrongPass(err) ? 'Wrong passcode. Please try again.' : 'Could not connect: ' + errText(err);
    });
  });

  function openChat() {
    $('login').classList.add('hidden');
    $('chat').classList.remove('hidden');
    $('who').textContent = 'You are ' + me; $('who').className = 'who';
  }

  function showLogin(msg) {
    stopPolling();
    closeSheet(); closePanel(); endSelect(); closeStk(); closeAttach();
    $('chat').classList.add('hidden');
    $('login').classList.remove('hidden');
    setPick(load('chatName'));
    $('passIn').value = '';
    $('loginErr').textContent = msg || '';
  }

  function signOut(msg) {
    store('chatPass', null); store('chatCache', null);
    picWipe(); picCache = {};
    pass = '';
    showLogin(msg || '');
  }
  $('logoutBtn').addEventListener('click', function () { signOut(''); });

  // ---------- Messages ----------
  function resetList() {
    lastRow = 0; firstRow = 0; lastDay = ''; seenRow = 0; otherDelivered = 0; otherSeen = 0;
    items = []; byId = {}; otherName = ''; queue = []; pendingEls = [];
    rv = null; pv = -1; pins = []; otherTyping = false; typingSent = false; typedAt = 0;
    setReply(null); paintPins();
    var list = $('list');
    while (list.firstChild) list.removeChild(list.firstChild);
    var empty = document.createElement('div');
    empty.id = 'empty'; empty.textContent = 'No messages yet. Say hello!';
    list.appendChild(empty);
    setTitle();
  }

  function setTitle() {
    $('title').textContent = otherName || 'Sukoon';
    $('avatar').textContent = (otherName || 'S').charAt(0).toUpperCase();
  }

  function saveCache() {
    var keep = items.length > KEEP ? items.slice(items.length - KEEP) : items;
    store('chatCache', JSON.stringify({ items: keep, last: lastRow, d: otherDelivered, s: otherSeen, rv: rv }));
  }

  function dayLabel(d) {
    var today = new Date(), y = new Date(); y.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return 'Today';
    if (d.toDateString() === y.toDateString()) return 'Yesterday';
    return d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }
  function timeLabel(t) {
    var d = new Date(t);
    return d.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function snippet(m) {
    return m.text ? String(m.text).slice(0, 140) : m.stk ? 'Sticker' : m.gif ? 'GIF' : m.pic ? 'Picture' : m.voice ? 'Voice message' : m.file ? 'Document: ' + m.file.name : '';
  }

  // Turns web addresses inside a message into links that open in the browser
  function fillText(el, text) {
    var re = /((?:https?:\/\/|www\.)[^\s<>"']+)/gi, pos = 0, m;
    while ((m = re.exec(text))) {
      var url = m[1], tail = '';
      var cut = /[.,!?;:)\]]+$/.exec(url);
      if (cut) { tail = cut[0]; url = url.slice(0, url.length - tail.length); }
      if (m.index > pos) el.appendChild(document.createTextNode(text.slice(pos, m.index)));
      var a = document.createElement('a');
      a.href = /^www\./i.test(url) ? 'https://' + url : url;
      a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = url;
      el.appendChild(a);
      if (tail) el.appendChild(document.createTextNode(tail));
      pos = m.index + m[1].length;
    }
    if (pos < text.length) el.appendChild(document.createTextNode(text.slice(pos)));
  }

  function rowOf(id) { return document.querySelector('.row[data-row="' + Number(id) + '"]'); }

  function makeQuote(r) {
    var q = document.createElement('div'); q.className = 'quote';
    var nm = document.createElement('b'); nm.textContent = isMe(r.name) ? 'You' : r.name;
    var tx = document.createElement('span'); tx.textContent = r.text;
    q.appendChild(nm); q.appendChild(tx);
    q.addEventListener('click', function () { jumpTo(r.id); });
    return q;
  }

  function daySep(d) {
    var day = document.createElement('div'); day.className = 'day'; day.setAttribute('data-day', d.toDateString());
    var sp = document.createElement('span'); sp.textContent = dayLabel(d);
    day.appendChild(sp);
    return day;
  }

  function buildRow(m) {
    byId[m.id] = m;
    var d = new Date(m.t);
    var mine = isMe(m.name);
    var row = document.createElement('div'); row.className = 'row' + (mine ? ' mine' : '');
    row.setAttribute('data-row', m.id);
    var b = document.createElement('div'); b.className = 'bubble';
    if (m.del) {
      // A deleted message keeps its place and time, with a short note instead of the content
      row.className += ' gone';
      var gx = document.createElement('div'); gx.className = 'text';
      gx.textContent = !m.by ? 'This message was deleted' : (isMe(m.by) ? 'You' : m.by) + ' deleted this message';
      var gt = document.createElement('div'); gt.className = 'time';
      gt.textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      b.appendChild(gx); b.appendChild(gt); row.appendChild(b);
      return row;
    }
    if (m.reply && m.reply.id) b.appendChild(makeQuote(m.reply));
    if (m.pic && m.stk) { row.className += ' stk'; b.appendChild(makeSticker(m)); }
    else if (m.pic) b.appendChild(makePic(m.pic));
    if (m.gif) b.appendChild(makeGif(m.gif));
    if (m.voice) b.appendChild(makeVoice(m.voice));
    if (m.file) b.appendChild(makeFile(m.file));
    if (m.text) { var tx = document.createElement('div'); tx.className = 'text' + (isBigEmoji(m.text) ? ' big' : ''); fillText(tx, m.text); b.appendChild(tx); }
    var tm = document.createElement('div'); tm.className = 'time';
    var pm = document.createElement('span'); pm.className = 'pinmark'; tm.appendChild(pm);
    tm.appendChild(document.createTextNode(d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })));
    tm.title = d.toLocaleString();
    if (mine) {
      var st = document.createElement('span'); st.className = 'stat';
      st.setAttribute('data-id', m.id);
      tm.appendChild(st);
    }
    b.appendChild(tm);
    var rc = document.createElement('div'); rc.className = 'reacts'; b.appendChild(rc);
    paintReacts(rc, m);
    // Tapping the bubble opens the menu (reactions, reply, pin, copy)
    b.addEventListener('click', function (ev) {
      if (Date.now() - swipedAt < 400) return;
      if (selecting) { ev.preventDefault(); toggleSel(m.id); return; }
      if (ev.target.closest('a, img.pic, audio, .quote, .chip, .file, button')) return;
      openSheet(m);
    });
    var rb = document.createElement('button'); rb.type = 'button'; rb.className = 'rbtn';
    rb.setAttribute('aria-label', 'Reply to this message');
    rb.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#93a0b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v4"/></svg>';
    rb.addEventListener('click', function () { setReply({ id: m.id, name: m.name, text: snippet(m) }); msgIn.focus(); });
    if (mine) { row.appendChild(rb); row.appendChild(b); } else { row.appendChild(b); row.appendChild(rb); }
    return row;
  }

  function addMessages(res, forceScroll) {
    if (!res) return;
    if (res.resync) { fullReload(); return; }
    var list = $('list');
    var nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
    var added = false, mineAdded = false, incoming = [];
    (res.items || []).forEach(function (m) {
      if (m.id <= lastRow) return;
      lastRow = m.id;
      if (!firstRow) firstRow = m.id;
      items.push(m);
      var empty = $('empty'); if (empty) empty.remove();
      var d = new Date(m.t);
      var dayKey = d.toDateString();
      if (dayKey !== lastDay) { lastDay = dayKey; list.appendChild(daySep(d)); }
      var mine = isMe(m.name);
      if (!mine && m.name) otherName = m.name;
      if (!mine && !m.del && !forceScroll) incoming.push(m);
      if (mine && pendingEls.length) { var old = pendingEls.shift(); if (old.parentNode) old.parentNode.removeChild(old); }
      list.appendChild(buildRow(m));
      added = true; if (mine) mineAdded = true;
    });
    if (res.last > lastRow) lastRow = res.last;
    var changed = false;
    if (res.status) {
      var nd = Math.max(otherDelivered, res.status.delivered || 0);
      var ns = Math.max(otherSeen, res.status.seen || 0);
      changed = nd !== otherDelivered || ns !== otherSeen;
      otherDelivered = nd; otherSeen = ns;
    }
    if (res.rx && res.rx.length) {
      res.rx.forEach(function (e) { if (e.del) e.del.forEach(function (id) { markDeleted(id, e.by); }); else applyRx(e.id, e.r); });
      changed = true;
    }
    if (typeof res.rv === 'number' && res.rv !== rv) { rv = res.rv; changed = true; }
    if (res.pins) { pins = res.pins; pv = res.pv; paintPins(); }
    if (typeof res.typing === 'boolean') setOtherTyping(res.typing && !(res.items || []).some(function (m) { return !isMe(m.name); }));
    paintStatus();
    setTitle();
    showOlderButton();
    if (added || changed) { saveCache(); }
    if (added) hotUntil = Date.now() + 30000;
    if (added && (forceScroll || nearBottom || mineAdded)) scrollDown();
    notifyIncoming(incoming);
  }

  // Shows "typing…" under the other person's name
  function setOtherTyping(on) {
    if (on === otherTyping) return;
    otherTyping = on;
    $('who').textContent = on ? 'typing…' : 'You are ' + me;
    $('who').className = 'who' + (on ? ' typing' : '');
    if (on) hotUntil = Date.now() + 15000;
  }

  function fullReload() {
    store('chatCache', null);
    resetList();
    api('getMessages', { pass: pass, after: 0, name: me, seen: 0 }).then(function (res) { addMessages(res, true); })
      .catch(function (err) { if (isWrongPass(err)) signOut('Please sign in again.'); });
  }

  // Sent -> Delivered -> Seen on my own messages
  function paintStatus() {
    var els = document.querySelectorAll('.stat');
    for (var i = 0; i < els.length; i++) {
      var id = Number(els[i].getAttribute('data-id'));
      var label = id <= otherSeen ? '✓✓ Seen' : id <= otherDelivered ? '✓✓ Delivered' : '✓ Sent';
      if (els[i].textContent !== label) els[i].textContent = label;
      els[i].className = 'stat' + (id <= otherSeen ? ' seen' : '');
    }
  }

  function scrollDown() { var list = $('list'); list.scrollTop = list.scrollHeight; }

  // ---------- Earlier messages ----------
  function showOlderButton() {
    var btn = $('older');
    if (firstRow > 2) {
      if (!btn) {
        btn = document.createElement('button'); btn.id = 'older'; btn.type = 'button';
        btn.textContent = 'Load earlier messages';
        btn.addEventListener('click', function () { loadOlder(300); });
        $('list').insertBefore(btn, $('list').firstChild);
      }
    } else if (btn) btn.remove();
  }

  function loadOlder(count) {
    if (loadingOlder || firstRow <= 2) return Promise.resolve(false);
    loadingOlder = true;
    var btn = $('older'); if (btn) btn.textContent = 'Loading…';
    return api('getOlder', { pass: pass, before: firstRow, count: count || 300 }).then(function (res) {
      loadingOlder = false;
      var older = (res && res.items) || [];
      if (!older.length) {
        // That stretch was all deleted messages: keep going from where the server stopped
        var more = res && res.start > 2 && res.start < firstRow;
        firstRow = more ? res.start : 2;
        var ob = $('older'); if (ob) ob.textContent = 'Load earlier messages';
        showOlderButton();
        return more;
      }
      var list = $('list');
      var frag = document.createDocumentFragment(), prevDay = '';
      older.forEach(function (m) {
        var d = new Date(m.t), k = d.toDateString();
        if (k !== prevDay) { prevDay = k; frag.appendChild(daySep(d)); }
        if (!isMe(m.name) && m.name && !otherName) otherName = m.name;
        frag.appendChild(buildRow(m));
      });
      var b = $('older');
      var after = b ? b.nextSibling : list.firstChild;
      // Avoid showing the same date heading twice where the old and new parts meet
      if (after && after.classList && after.classList.contains('day') && after.getAttribute('data-day') === prevDay) {
        var dup = after; after = after.nextSibling; dup.remove();
      }
      var before = list.scrollHeight;
      list.insertBefore(frag, after);
      list.scrollTop += list.scrollHeight - before;
      items = older.concat(items);
      firstRow = res.start || older[0].id;
      if (b) b.textContent = 'Load earlier messages';
      paintStatus(); paintPins(); setTitle(); showOlderButton();
      return true;
    }).catch(function (err) {
      loadingOlder = false;
      var b = $('older'); if (b) b.textContent = 'Load earlier messages';
      setStatus('Could not load earlier messages: ' + errText(err));
      return false;
    });
  }

  // Scrolls to a message, loading earlier messages first if it is further back
  function jumpTo(id) {
    id = Number(id);
    var target = rowOf(id);
    if (target) {
      setStatus('');
      target.scrollIntoView({ block: 'center' });
      target.classList.remove('flash'); void target.offsetWidth; target.classList.add('flash');
      return;
    }
    if (!(id >= 2) || id >= firstRow || firstRow <= 2) { setStatus('That message could not be found.'); return; }
    setStatus('Finding that message…');
    loadOlder(Math.min(500, firstRow - id + 30)).then(function (ok) {
      if (ok) jumpTo(id); else setStatus('That message could not be found.');
    });
  }

  // ---------- Pictures and voice inside messages ----------
  function fetchMedia(id) {
    if (picCache[id]) return Promise.resolve(picCache[id]);
    return picLoad(id).then(function (saved) {
      if (saved) { picCache[id] = saved; return saved; }
      return api('getPicture', { pass: pass, id: id }).then(function (src) { picSave(id, src); picCache[id] = src; return src; });
    });

  function fileCard(name, note) {
    var card = document.createElement('div'); card.className = 'file';
    card.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#e0a030" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';

  function makeFile(f) {
    var touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    var note = sizeLabel(f.size) + ' \u00B7 tap to download';
    var card = fileCard(f.name, note), busyDl = false, ready = null;
    var sm = card.querySelector('small');

    function saveByLink() {
      var url = URL.createObjectURL(ready);
      var a = document.createElement('a'); a.href = url; a.download = f.name; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    }
    // On phones, hand the file to the phone's own "open / save" sheet when it can take it
    function deliver() {
      var canShare = false;
      try { canShare = touch && navigator.canShare && navigator.canShare({ files: [ready] }); } catch (e) {}
      if (!canShare) { saveByLink(); return; }
      navigator.share({ files: [ready], title: f.name }).catch(function (err) {
        if (!err || err.name !== 'AbortError') saveByLink();
      });
    }

    card.addEventListener('click', function () {
      if (selecting || busyDl) return;
      if (ready) { deliver(); return; }
      busyDl = true; sm.textContent = 'Downloading…';
      api('getPicture', { pass: pass, id: f.id }).then(function (src) {
        // Turn the received text back into the real file
        var at = src.indexOf('base64,');
        var type = src.slice(5, src.indexOf(';')) || 'application/octet-stream';
        var bin = atob(src.slice(at + 7)), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        ready = new File([bytes], f.name, { type: type });
        busyDl = false;
        if (touch) {
          // Phones only allow saving straight after a tap, so ask for one more
          sm.textContent = sizeLabel(f.size) + ' \u00B7 ready, tap to open or save';
        } else {
          sm.textContent = sizeLabel(f.size) + ' \u00B7 tap to save again';
          deliver();
        }
      }).catch(function (err) {
        busyDl = false; sm.textContent = note;
        setStatus('Could not download: ' + errText(err));
      });
    });
    return card;
  }

    panelNote('Searching…');
    api('search', { pass: pass, q: q }).then(function (res) {
      if (panelMode !== 'search') return;
      var found = (res && res.items) || [];
      if (!found.length) { panelNote('No messages contain "' + q + '".'); return; }
      panelItems(found, false);
    }).catch(function (err) { panelNote('Search did not work: ' + errText(err)); });
  });

  // ---------- Notifications ----------
  function notifySupported() { return 'Notification' in window; }
  function notifyReady() { return notifyOn && notifySupported() && Notification.permission === 'granted'; }

  function paintBell() {
    if (!$('bellBtn')) return;
    var on = notifyReady();
    $('bellBtn').className = 'hbtn' + (on ? ' on' : '');
    $('bellBtn').setAttribute('aria-label', on ? 'Notifications are on. Tap to turn off.' : 'Notifications are off. Tap to turn on.');
  }

  if ($('bellBtn')) $('bellBtn').addEventListener('click', function () {
    if (!notifySupported()) { setStatus('This phone or browser cannot show notifications. On iPhone, add the app to the Home Screen first.'); return; }
    if (notifyReady()) { notifyOn = false; store('chatNotify', null); paintBell(); setInfo('Notifications turned off.'); return; }
    Notification.requestPermission().then(function (p) {
      if (p !== 'granted') { setStatus('Notifications are blocked. Allow them for this app in the browser or phone settings.'); return; }
      notifyOn = true; store('chatNotify', '1'); paintBell(); beep();
      setInfo('Notifications turned on.');
    });
  });

  // A short soft tone for an incoming message
  function beep() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.15, audioCtx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.25);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.26);
    } catch (e) {}
  }

  function paintUnread() {
    document.title = unread ? '(' + unread + ') Sukoon' : 'Sukoon';
    try {
      if (unread && navigator.setAppBadge) navigator.setAppBadge(unread);
      else if (!unread && navigator.clearAppBadge) navigator.clearAppBadge();
    } catch (e) {}
  }

  function notifyIncoming(list) {
    if (!list.length) return;
    var away = document.hidden || !document.hasFocus();
    if (away) { unread += list.length; paintUnread(); }
    if (!notifyReady()) return;
    beep();
    if (!away) return;
    var last = list[list.length - 1];
    var opts = { body: unread > 1 ? unread + ' new messages' : snippet(last), icon: 'icon-192.png', badge: 'icon-192.png', tag: 'sukoon', renotify: true };
    var plain = function () { try { new Notification(last.name, opts); } catch (e) {} };
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg && reg.showNotification) return reg.showNotification(last.name, opts);
        plain();
      }).catch(plain);
    } else plain();
  }

  function clearUnread() {
    if (document.hidden) return;
    if (unread) { unread = 0; paintUnread(); }
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg && reg.getNotifications) reg.getNotifications({ tag: 'sukoon' }).then(function (ns) { ns.forEach(function (n) { n.close(); }); });
      }).catch(function () {});
    }
  }
  window.addEventListener('focus', clearUnread);
  document.addEventListener('visibilitychange', clearUnread);

  // ---------- Checking for new messages ----------
  function poll() {
    if (!pass) return;
    if (busy) { wantPoll = true; return; }
    if (!document.hidden) seenRow = lastRow;
    busy = true;
    // Tell the other person while I am typing, and once more when I stop
    var typingNow = !document.hidden && !!msgIn.value && Date.now() - typedAt < 4000, tflag;
    if (typingNow) { tflag = 1; typingSent = true; }
    else if (typingSent) { tflag = 0; typingSent = false; }
    api('getMessages', { pass: pass, after: lastRow || 1, name: me, seen: seenRow, rv: rv, pv: pv, typing: tflag }).then(function (res) {
      busy = false; if ($('status').getAttribute('data-net')) setStatus('');
      addMessages(res, false);
      if (wantPoll) { wantPoll = false; poll(); }
    }).catch(function (err) {
      busy = false; wantPoll = false;
      if (isWrongPass(err)) signOut('Please sign in again.');
      else setStatus(navigator.onLine === false ? 'No internet. Waiting to reconnect…' : 'Connection problem. Trying again…', true);
    });
  }
  // A neutral note that clears itself after a few seconds
  function setInfo(msg) {
    setStatus(msg);
    $('status').className = 'info';
    setTimeout(function () { if ($('status').textContent === msg) setStatus(''); }, 3000);
  }
  function setStatus(msg, net) {
    $('status').className = '';
    $('status').textContent = msg;
    if (net) $('status').setAttribute('data-net', '1'); else $('status').removeAttribute('data-net');
  }
  // Checks about every second while you are chatting, slower when idle or in the background
  function nextDelay() {
    if (document.hidden) return 10000;
    return Date.now() < hotUntil ? 1000 : 2500;
  }
  function startPolling() {
    stopPolling();
    (function loop() { timer = setTimeout(function () { poll(); loop(); }, nextDelay()); })();
  }
  function stopPolling() { if (timer) { clearTimeout(timer); timer = null; } }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && pass) { seenRow = lastRow; hotUntil = Date.now() + 30000; poll(); startPolling(); }
  });
  window.addEventListener('online', poll);

  // ---------- Replying ----------
  function setReply(r) {
    replyTo = r;
    if (!r) { $('replybar').classList.add('hidden'); return; }
    $('replyName').textContent = 'Replying to ' + (isMe(r.name) ? 'yourself' : r.name);
    $('replyText').textContent = r.text;
    $('replybar').classList.remove('hidden');
  }
  $('replyCancel').addEventListener('click', function () { setReply(null); });

  // Swipe a message to the right to reply to it
  (function () {
    var list = $('list');
    list.addEventListener('touchstart', function (ev) {
      swipe = null;
      if (selecting || ev.touches.length !== 1 || ev.target.closest('audio')) return;
      var row = ev.target.closest('.row');
      if (!row || !row.getAttribute('data-row') || row.classList.contains('gone')) return;
      swipe = { row: row, b: row.querySelector('.bubble'), x: ev.touches[0].clientX, y: ev.touches[0].clientY, dx: 0, on: false };
    }, { passive: true });
    list.addEventListener('touchmove', function (ev) {
      if (!swipe) return;
      var dx = ev.touches[0].clientX - swipe.x, dy = ev.touches[0].clientY - swipe.y;
      if (!swipe.on) {
        if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { swipe = null; return; } // scrolling, not swiping
        if (dx > 12 && Math.abs(dx) > Math.abs(dy) * 1.5) swipe.on = true; else return;
      }
      swipe.dx = Math.max(0, Math.min(dx, 90));
      swipe.b.style.transition = 'none';
      swipe.b.style.transform = 'translateX(' + swipe.dx + 'px)';
    }, { passive: true });
    function end() {
      if (!swipe) return;
      var sw = swipe; swipe = null;
      if (!sw.on) return;
      swipedAt = Date.now();
      sw.b.style.transition = 'transform .18s';
      sw.b.style.transform = '';
      if (sw.dx >= 56) {
        var m = byId[Number(sw.row.getAttribute('data-row'))];
        if (m) {
          setReply({ id: m.id, name: m.name, text: snippet(m) });
          if (navigator.vibrate) { try { navigator.vibrate(10); } catch (e) {} }
          msgIn.focus();
        }
      }
    }
    list.addEventListener('touchend', end);
    list.addEventListener('touchcancel', end);
  })();

  // ---------- Sending ----------
  var msgIn = $('msgIn');
  msgIn.addEventListener('input', function () {
    msgIn.style.height = 'auto';
    msgIn.style.height = Math.min(msgIn.scrollHeight, 120) + 'px';
    typedAt = Date.now();
    hotUntil = Math.max(hotUntil, Date.now() + 8000);
    if (!typingSent) poll(); // let the other person know straight away
  });
  msgIn.addEventListener('keydown', function (ev) {
    // On a computer, Enter sends and Shift+Enter makes a new line
    if (ev.key === 'Enter' && !ev.shiftKey && !('ontouchstart' in window)) { ev.preventDefault(); send(); }
  });
  $('sendBtn').addEventListener('click', send);

  // Shows the message at once, then sends it in the background, one at a time
  function send() {
    var text = msgIn.value.trim();
    if (!text && !pendingPic && !pendingFile) return;
    typedAt = 0;
    enqueue({ text: text, pic: pendingPic, voice: '', reply: replyTo, doc: pendingFile });
    clearDoc();
    setReply(null);
    msgIn.value = ''; msgIn.style.height = 'auto';
    clearPic();
  }

  function enqueue(job) {
    var row = document.createElement('div'); row.className = 'row mine pending' + (job.sticker ? ' stk' : '');
    var b = document.createElement('div'); b.className = 'bubble';
    if (job.reply) b.appendChild(makeQuote(job.reply));
    if (job.gif) { var gi = document.createElement('img'); gi.className = 'pic gifimg'; gi.alt = 'GIF being sent'; gi.src = job.gif; b.appendChild(gi); }
    if (job.sticker) { var si = document.createElement('img'); si.className = 'stkimg'; si.alt = 'Sticker being sent'; if (picCache[job.sticker]) si.src = picCache[job.sticker]; b.appendChild(si); }
    if (job.pic) { var im = document.createElement('img'); im.className = 'pic'; im.alt = 'Picture being sent'; im.src = job.pic; b.appendChild(im); }
    if (job.doc) b.appendChild(fileCard(job.doc.name, sizeLabel(job.doc.size)));
    if (job.voice) { var v = document.createElement('div'); v.className = 'text'; v.textContent = 'Voice message'; b.appendChild(v); }
    if (job.text) { var tx = document.createElement('div'); tx.className = 'text'; fillText(tx, job.text); b.appendChild(tx); }
    var tm = document.createElement('div'); tm.className = 'time'; tm.textContent = 'Sending…';
    b.appendChild(tm); row.appendChild(b);
    var empty = $('empty'); if (empty) empty.remove();
    $('list').appendChild(row);
    scrollDown();
    job.el = row;
    pendingEls.push(row);
    queue.push(job);
    hotUntil = Date.now() + 30000;
    setStatus('');
    pump();
  }

  function pump() {
    if (sending || !queue.length) return;
    sending = true;
    var job = queue[0];
    // A document is read from the phone just before it is sent
    var ready = !job.doc ? Promise.resolve(null) : new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res({ name: job.doc.name, type: job.doc.type || '', data: String(fr.result) }); };
      fr.onerror = function () { rej(new Error('the document could not be read from this phone')); };
      fr.readAsDataURL(job.doc);
    });
    ready.then(function (file) {
      return api('sendMessage', { pass: pass, name: me, text: job.text, pic: job.pic, voice: job.voice, reply: job.reply || null, file: file, sticker: job.sticker || '', gif: job.gif || '' });
    }).then(function () {
      sending = false; queue.shift();
      poll();
      pump();
    }).catch(function (err) {
      sending = false;
      // Give up on everything waiting, and put the typed text back so nothing is lost
      var lost = queue; queue = [];
      lost.forEach(function (j) {
        var i = pendingEls.indexOf(j.el); if (i !== -1) pendingEls.splice(i, 1);
        if (j.el.parentNode) j.el.parentNode.removeChild(j.el);
      });
      if (isWrongPass(err)) { signOut('Please sign in again.'); return; }
      var texts = lost.map(function (j) { return j.text; }).filter(Boolean).join('\n');
      if (texts && !msgIn.value) msgIn.value = texts;
      setStatus('Not sent: ' + errText(err) + '. Please send again.');
    });
  }

  // ---------- Voice messages ----------
  var rec = null, recStream = null, recChunks = [], recTimer = null, recStart = 0, recSendIt = false, REC_MAX = 120;

  function recMime() {
    var types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
    for (var i = 0; i < types.length; i++) {
      try { if (MediaRecorder.isTypeSupported(types[i])) return types[i]; } catch (e) {}
    }
    return '';
  }

  $('micBtn').addEventListener('click', function () {
    if (rec) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
      setStatus('This phone or browser cannot record voice messages.');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      recStream = stream; recChunks = []; recSendIt = false;
      var mime = recMime();
      var opts = { audioBitsPerSecond: 32000 };
      if (mime) opts.mimeType = mime;
      try { rec = new MediaRecorder(stream, opts); } catch (e) { rec = new MediaRecorder(stream); }
      rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) recChunks.push(ev.data); };
      rec.onstop = recDone;
      rec.start();
      recStart = Date.now();
      setStatus('');
      $('composer').classList.add('hidden');
      $('recbar').classList.remove('hidden');
      $('recTime').textContent = 'Recording 0:00';
      recTimer = setInterval(function () {
        var s = Math.floor((Date.now() - recStart) / 1000);
        $('recTime').textContent = 'Recording ' + Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
        if (s >= REC_MAX) recStop(true);
      }, 500);
    }).catch(function () {
      setStatus('Microphone not allowed. Allow the microphone for this app and try again.');
    });
  });
  $('recCancel').addEventListener('click', function () { recStop(false); });
  $('recSend').addEventListener('click', function () { recStop(true); });

  function recStop(sendIt) {
    if (!rec) return;
    recSendIt = sendIt;
    if (recTimer) { clearInterval(recTimer); recTimer = null; }
    try { rec.stop(); } catch (e) { recDone(); }
  }

  function recDone() {
    var type = ((rec && rec.mimeType) || 'audio/webm').split(';')[0];
    var chunks = recChunks, sendIt = recSendIt;
    if (recStream) recStream.getTracks().forEach(function (t) { t.stop(); });
    rec = null; recStream = null; recChunks = [];
    $('recbar').classList.add('hidden');
    $('composer').classList.remove('hidden');
    if (!sendIt || !chunks.length) return;
    var fr = new FileReader();
    fr.onload = function () {
      var b64 = String(fr.result).split('base64,')[1] || '';
      if (!b64) { setStatus('The recording was empty. Please try again.'); return; }
      enqueue({ text: '', pic: '', voice: 'data:' + type + ';base64,' + b64, reply: replyTo });
      setReply(null);
    };
    fr.readAsDataURL(new Blob(chunks, { type: type }));
  }

  // ---------- Choosing a document ----------
  $('docBtn').addEventListener('click', function () { $('docIn').click(); });
  $('removeDoc').addEventListener('click', clearDoc);

  function clearDoc() {
    pendingFile = null; $('docIn').value = '';
    $('docbar').classList.add('hidden');
  }

  $('docIn').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    if (f.size > MAX_FILE) { clearDoc(); setStatus('That document is ' + sizeLabel(f.size) + '. The limit is 10 MB.'); return; }
    if (!f.size) { clearDoc(); setStatus('That document is empty.'); return; }
    pendingFile = f;
    $('docName').textContent = f.name + ' (' + sizeLabel(f.size) + ')';
    $('docbar').classList.remove('hidden');
    setStatus('');
  });

  // ---------- Choosing a picture ----------
  $('picBtn').addEventListener('click', function () { $('fileIn').click(); });
  $('removePic').addEventListener('click', clearPic);

  function clearPic() {
    pendingPic = ''; $('fileIn').value = '';
    $('preview').classList.add('hidden'); $('previewImg').removeAttribute('src');
  }

  $('fileIn').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (f) usePicture(f);
  });

  // Pasting a copied picture or screenshot into the message box attaches it
  msgIn.addEventListener('paste', function (ev) {
    var cd = ev.clipboardData;
    if (!cd) return;
    var f = null, i;
    for (i = 0; cd.files && i < cd.files.length; i++) { if (/^image\//.test(cd.files[i].type)) { f = cd.files[i]; break; } }
    for (i = 0; !f && cd.items && i < cd.items.length; i++) {
      if (cd.items[i].kind === 'file' && /^image\//.test(cd.items[i].type)) f = cd.items[i].getAsFile();
    }
    if (!f) return; // ordinary text: paste as usual
    ev.preventDefault();
    usePicture(f);
  });

  function usePicture(f) {
    // An animated GIF is sent as it is, so it keeps moving
    if (f.type === 'image/gif') {
      if (f.size > 4 * 1024 * 1024) { setStatus('That GIF is ' + sizeLabel(f.size) + '. The limit is 4 MB.'); return; }
      var fr = new FileReader();
      fr.onload = function () {
        pendingPic = String(fr.result);
        $('previewImg').src = pendingPic;
        $('preview').classList.remove('hidden');
        setStatus('');
      };
      fr.readAsDataURL(f);
      return;
    }
    var url = URL.createObjectURL(f);
    var img = new Image();
    img.onload = function () {
      // Shrink large photos so they send quickly
      var max = 1280, w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.round(w * scale); c.height = Math.round(h * scale);
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      pendingPic = c.toDataURL('image/jpeg', 0.8);
      URL.revokeObjectURL(url);
      $('previewImg').src = pendingPic;
      $('preview').classList.remove('hidden');
      setStatus('');
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      setStatus('That picture could not be opened. Try another one.');
    };
    img.src = url;
  }

  // ---------- Start: open straight into the saved chat ----------
  (function () {
    notifyOn = false; // notifications are switched off in this version
    var n = known(load('chatName')), p = load('chatPass');
    if (!(n && p)) { showLogin(API ? '' : 'The app link is not set yet. Put your /exec link in config.js.'); return; }
    me = n; pass = p;
    openChat();
    resetList();
    var saved = null;
    try { saved = JSON.parse(load('chatCache') || 'null'); } catch (e) {}
    if (saved && saved.items && saved.items.length) {
      addMessages({ items: saved.items, last: saved.last, status: { delivered: saved.d, seen: saved.s } }, true);
      // Old saved copies have no reaction marker; 0 makes the server send what was missed or ask for a reload
      rv = typeof saved.rv === 'number' ? saved.rv : 0;
      startPolling();
      poll();
    } else {
      api('getMessages', { pass: p, after: 0, name: n, seen: 0 }).then(function (res) {
        addMessages(res, true);
        startPolling();
      }).catch(function (err) {
        if (isWrongPass(err)) signOut('Please sign in again.');
        else { setStatus('Connection problem. Trying again…', true); startPolling(); }
      });
    }
  })();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
