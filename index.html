<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sukoon</title>
<meta name="theme-color" content="#1f2f4a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sukoon">
<style>
  :root {
    --navy: #1f2f4a; --navy-2: #2b4166; --amber: #e0a030;
    --bg: #e9edf2; --mine: #dbe7fb; --theirs: #ffffff; --ink: #1c2430; --muted: #6b7686;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: var(--bg); font-size: 16px; }
  button, input, textarea { font: inherit; }
  .hidden { display: none !important; }

  /* Sign-in */
  #login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { width: 100%; max-width: 360px; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 6px 24px rgba(31,47,74,.12); }
  .card h1 { margin: 0 0 4px; font-size: 22px; color: var(--navy); }
  .card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .card label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  .card input { width: 100%; padding: 12px; border: 1px solid #c9d1dc; border-radius: 10px; }
  .card input:focus, textarea:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
  .primary { width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 10px; background: var(--navy); color: #fff; font-weight: 600; cursor: pointer; }
  .primary:disabled { opacity: .6; }
  #loginErr { color: #b3261e; font-size: 14px; min-height: 20px; margin-top: 10px; overflow-wrap: anywhere; }

  /* Chat */
  #chat { height: 100%; height: 100dvh; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; background: var(--bg); }
  header { background: var(--navy); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; display: flex; align-items: center; gap: 12px; border-bottom: 3px solid var(--amber); }
  .avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--amber); color: var(--navy); font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  header .grow { flex: 1; min-width: 0; }
  header .title { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .who { font-size: 12px; opacity: .8; }
  header button { flex: none; background: transparent; border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  #list { flex: 1; overflow-y: auto; padding: 12px 10px 4px; -webkit-overflow-scrolling: touch; }
  .day { text-align: center; margin: 14px 0 10px; }
  .day span { background: #d5dbe4; color: #3c4756; font-size: 12px; padding: 4px 10px; border-radius: 999px; }
  .row { display: flex; margin: 4px 0; }
  .row.mine { justify-content: flex-end; }
  .bubble { max-width: 82%; background: var(--theirs); border-radius: 14px 14px 14px 4px; padding: 8px 11px 6px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .mine .bubble { background: var(--mine); border-radius: 14px 14px 4px 14px; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.35; }
  .time { font-size: 11px; color: var(--muted); text-align: right; margin-top: 3px; }
  .stat { margin-left: 6px; font-weight: 600; }
  .stat.seen { color: #1a73e8; }
  .pic { display: block; max-width: 100%; max-height: 300px; border-radius: 10px; margin: 2px 0 4px; cursor: zoom-in; }
  .picwait { width: 180px; height: 120px; border-radius: 10px; background: rgba(0,0,0,.07); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; margin: 2px 0 4px; }
  #empty { text-align: center; color: var(--muted); margin-top: 40px; font-size: 14px; }
  #status { text-align: center; font-size: 12px; color: #b3261e; min-height: 16px; padding: 0 12px; overflow-wrap: anywhere; }

  #preview { padding: 8px 12px 0; display: flex; align-items: center; gap: 10px; }
  #preview img { height: 64px; border-radius: 8px; }
  #preview button { border: 0; background: #d5dbe4; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  #composer { display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); }
  #composer textarea { flex: 1; resize: none; border: 1px solid #c9d1dc; border-radius: 22px; padding: 11px 14px; max-height: 120px; line-height: 1.3; background: #fff; }
  .round { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #picBtn { background: #fff; border: 1px solid #c9d1dc; }
  #sendBtn { background: var(--navy); }
  #sendBtn:disabled { opacity: .5; }
  .round svg { width: 22px; height: 22px; }

  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; }
  #viewer img { max-width: 100%; max-height: 100%; }
</style>
</head>
<body>

<div id="login" class="hidden">
  <form class="card" id="loginForm">
    <h1>Sukoon</h1>
    <p>Enter your name and the passcode you both share.</p>
    <label for="nameIn">Your name</label>
    <input id="nameIn" maxlength="30" autocomplete="off" required>
    <label for="passIn">Passcode</label>
    <input id="passIn" type="password" autocomplete="off" required>
    <button class="primary" id="loginBtn" type="submit">Enter chat</button>
    <div id="loginErr"></div>
  </form>
</div>

<div id="chat" class="hidden">
  <header>
    <div class="avatar" id="avatar">S</div>
    <div class="grow">
      <div class="title" id="title">Sukoon</div>
      <div class="who" id="who"></div>
    </div>
    <button id="logoutBtn" type="button">Sign out</button>
  </header>
  <div id="list"></div>
  <div id="status"></div>
  <div id="preview" class="hidden">
    <img id="previewImg" alt="Picture to send">
    <button id="removePic" type="button">Remove</button>
  </div>
  <div id="composer">
    <button class="round" id="picBtn" type="button" aria-label="Add a picture">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1f2f4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>
    </button>
    <textarea id="msgIn" rows="1" placeholder="Message" maxlength="4000"></textarea>
    <button class="round" id="sendBtn" type="button" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
    </button>
  </div>
  <input id="fileIn" type="file" accept="image/*" class="hidden">
</div>

<div id="viewer" class="hidden"><img id="viewerImg" alt="Picture"></div>

<script src="config.js"></script>
<script>
  var API = (window.CHAT_API || '').trim();
  var POLL_MS = 3500, KEEP = 200;
  var me = '', pass = '', lastRow = 0, lastDay = '', busy = false, sending = false, timer = null;
  var pendingPic = '', picCache = {}, items = [];
  var seenRow = 0, otherDelivered = 0, otherSeen = 0, tick = 0, otherName = '';

  function $(id) { return document.getElementById(id); }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

  // ---------- Talking to the Google script ----------
  function api(action, data) {
    if (!API || API.indexOf('https://') !== 0) {
      return Promise.reject(new Error('The app link is not set yet. Put your /exec link in config.js.'));
    }
    data = data || {};
    data.action = action;
    return fetch(API, { method: 'POST', body: JSON.stringify(data), redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok) throw new Error((j && j.error) || 'Unknown problem');
        return j.data;
      });
  }
  function isWrongPass(err) { return String(err && err.message || err).indexOf('WRONG_PASSCODE') !== -1; }

  // ---------- Pictures kept on this device so they open instantly ----------
  var dbP = null;
  function db() {
    if (dbP) return dbP;
    dbP = new Promise(function (res, rej) {
      try {
        var rq = indexedDB.open('sukoon-chat', 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore('pics'); };
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { rej(rq.error); };
      } catch (e) { rej(e); }
    });
    return dbP;
  }
  function picLoad(id) {
    return db().then(function (d) {
      return new Promise(function (res) {
        var rq = d.transaction('pics').objectStore('pics').get(id);
        rq.onsuccess = function () { res(rq.result || ''); };
        rq.onerror = function () { res(''); };
      });
    }).catch(function () { return ''; });
  }
  function picSave(id, src) {
    db().then(function (d) { d.transaction('pics', 'readwrite').objectStore('pics').put(src, id); }).catch(function () {});
  }
  function picWipe() {
    db().then(function (d) { d.transaction('pics', 'readwrite').objectStore('pics').clear(); }).catch(function () {});
  }

  // ---------- Sign in ----------
  $('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var n = $('nameIn').value.trim(), p = $('passIn').value;
    if (!n || !p) return;
    $('loginBtn').disabled = true;
    $('loginErr').textContent = '';
    api('getMessages', { pass: p, after: 0, name: n, seen: 0 }).then(function (res) {
      $('loginBtn').disabled = false;
      me = n; pass = p;
      store('chatName', n); store('chatPass', p);
      openChat();
      resetList();
      addMessages(res, true);
      startPolling();
    }).catch(function (err) {
      $('loginBtn').disabled = false;
      $('loginErr').textContent = isWrongPass(err) ? 'Wrong passcode. Please try again.' : 'Could not connect: ' + String(err && err.message || err);
    });
  });

  function openChat() {
    $('login').classList.add('hidden');
    $('chat').classList.remove('hidden');
    $('who').textContent = 'You are ' + me;
  }

  function showLogin(msg) {
    stopPolling();
    $('chat').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('nameIn').value = load('chatName');
    $('passIn').value = '';
    $('loginErr').textContent = msg || '';
  }

  function signOut(msg) {
    store('chatPass', null); store('chatCache', null);
    picWipe(); picCache = {};
    pass = '';
    showLogin(msg || '');
  }
  $('logoutBtn').addEventListener('click', function () { signOut(''); });

  // ---------- Messages ----------
  function resetList() {
    lastRow = 0; lastDay = ''; seenRow = 0; otherDelivered = 0; otherSeen = 0; items = []; otherName = '';
    var list = $('list');
    while (list.firstChild) list.removeChild(list.firstChild);
    var empty = document.createElement('div');
    empty.id = 'empty'; empty.textContent = 'No messages yet. Say hello!';
    list.appendChild(empty);
    setTitle();
  }

  function setTitle() {
    $('title').textContent = otherName || 'Sukoon';
    $('avatar').textContent = (otherName || 'S').charAt(0).toUpperCase();
  }

  function saveCache() {
    if (items.length > KEEP) items = items.slice(items.length - KEEP);
    store('chatCache', JSON.stringify({ items: items, last: lastRow, d: otherDelivered, s: otherSeen }));
  }

  function dayLabel(d) {
    var today = new Date(), y = new Date(); y.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return 'Today';
    if (d.toDateString() === y.toDateString()) return 'Yesterday';
    return d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }

  function addMessages(res, forceScroll) {
    if (!res) return;
    var list = $('list');
    var nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
    var added = false, mineAdded = false;
    (res.items || []).forEach(function (m) {
      if (m.id <= lastRow) return;
      lastRow = m.id;
      items.push(m);
      var empty = $('empty'); if (empty) empty.remove();
      var d = new Date(m.t);
      var dayKey = d.toDateString();
      if (dayKey !== lastDay) {
        lastDay = dayKey;
        var day = document.createElement('div'); day.className = 'day';
        var sp = document.createElement('span'); sp.textContent = dayLabel(d);
        day.appendChild(sp); list.appendChild(day);
      }
      var mine = m.name === me;
      if (!mine && m.name) otherName = m.name;
      var row = document.createElement('div'); row.className = 'row' + (mine ? ' mine' : '');
      var b = document.createElement('div'); b.className = 'bubble';
      if (m.pic) b.appendChild(makePic(m.pic));
      if (m.text) { var tx = document.createElement('div'); tx.className = 'text'; tx.textContent = m.text; b.appendChild(tx); }
      var tm = document.createElement('div'); tm.className = 'time';
      tm.textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      tm.title = d.toLocaleString();
      if (mine) {
        var st = document.createElement('span'); st.className = 'stat';
        st.setAttribute('data-id', m.id);
        tm.appendChild(st);
      }
      b.appendChild(tm);
      row.appendChild(b); list.appendChild(row);
      added = true; if (mine) mineAdded = true;
    });
    if (res.last > lastRow) lastRow = res.last;
    var statusChanged = false;
    if (res.status) {
      var nd = Math.max(otherDelivered, res.status.delivered || 0);
      var ns = Math.max(otherSeen, res.status.seen || 0);
      statusChanged = nd !== otherDelivered || ns !== otherSeen;
      otherDelivered = nd; otherSeen = ns;
    }
    paintStatus();
    setTitle();
    if (added || statusChanged) saveCache();
    if (added && (forceScroll || nearBottom || mineAdded)) scrollDown();
  }

  // Sent -> Delivered -> Seen on my own messages
  function paintStatus() {
    var els = document.querySelectorAll('.stat');
    for (var i = 0; i < els.length; i++) {
      var id = Number(els[i].getAttribute('data-id'));
      var label = id <= otherSeen ? '✓✓ Seen' : id <= otherDelivered ? '✓✓ Delivered' : '✓ Sent';
      if (els[i].textContent !== label) els[i].textContent = label;
      els[i].className = 'stat' + (id <= otherSeen ? ' seen' : '');
    }
  }

  function scrollDown() { var list = $('list'); list.scrollTop = list.scrollHeight; }

  function makePic(id) {
    var wait = document.createElement('div'); wait.className = 'picwait'; wait.textContent = 'Loading picture…';
    function show(src) {
      picCache[id] = src;
      var img = document.createElement('img'); img.className = 'pic'; img.alt = 'Shared picture'; img.src = src;
      var list = $('list');
      var nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 200;
      img.addEventListener('load', function () { if (nearBottom) scrollDown(); });
      img.addEventListener('click', function () { $('viewerImg').src = src; $('viewer').classList.remove('hidden'); });
      if (wait.parentNode) wait.parentNode.replaceChild(img, wait);
    }
    if (picCache[id]) { setTimeout(function () { show(picCache[id]); }, 0); return wait; }
    picLoad(id).then(function (saved) {
      if (saved) { show(saved); return; }
      return api('getPicture', { pass: pass, id: id }).then(function (src) { picSave(id, src); show(src); });
    }).catch(function () { wait.textContent = 'Picture could not load'; });
    return wait;
  }

  $('viewer').addEventListener('click', function () { $('viewer').classList.add('hidden'); });

  // ---------- Checking for new messages ----------
  function poll() {
    if (busy || !pass) return;
    // In the background, check less often; messages then count as delivered, not seen
    tick++;
    if (document.hidden) { if (tick % 3) return; } else { seenRow = lastRow; }
    busy = true;
    api('getMessages', { pass: pass, after: lastRow || 1, name: me, seen: seenRow }).then(function (res) {
      busy = false; $('status').textContent = '';
      addMessages(res, false);
    }).catch(function (err) {
      busy = false;
      if (isWrongPass(err)) signOut('The passcode has changed. Please sign in again.');
      else $('status').textContent = navigator.onLine === false ? 'No internet. Waiting to reconnect…' : 'Connection problem. Trying again…';
    });
  }
  function startPolling() { stopPolling(); timer = setInterval(poll, POLL_MS); }
  function stopPolling() { if (timer) { clearInterval(timer); timer = null; } }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { seenRow = lastRow; poll(); } });
  window.addEventListener('online', poll);

  // ---------- Sending ----------
  var msgIn = $('msgIn');
  msgIn.addEventListener('input', function () {
    msgIn.style.height = 'auto';
    msgIn.style.height = Math.min(msgIn.scrollHeight, 120) + 'px';
  });
  msgIn.addEventListener('keydown', function (ev) {
    // On a computer, Enter sends and Shift+Enter makes a new line
    if (ev.key === 'Enter' && !ev.shiftKey && !('ontouchstart' in window)) { ev.preventDefault(); send(); }
  });
  $('sendBtn').addEventListener('click', send);

  function send() {
    if (sending) return;
    var text = msgIn.value.trim();
    if (!text && !pendingPic) return;
    sending = true; $('sendBtn').disabled = true;
    $('status').textContent = pendingPic ? 'Sending picture…' : '';
    api('sendMessage', { pass: pass, name: me, text: text, pic: pendingPic }).then(function () {
      sending = false; $('sendBtn').disabled = false; $('status').textContent = '';
      msgIn.value = ''; msgIn.style.height = 'auto';
      clearPic();
      poll();
    }).catch(function (err) {
      sending = false; $('sendBtn').disabled = false;
      if (isWrongPass(err)) signOut('The passcode has changed. Please sign in again.');
      else $('status').textContent = 'Message not sent. Please tap send again.';
    });
  }

  // ---------- Choosing a picture ----------
  $('picBtn').addEventListener('click', function () { $('fileIn').click(); });
  $('removePic').addEventListener('click', clearPic);

  function clearPic() {
    pendingPic = ''; $('fileIn').value = '';
    $('preview').classList.add('hidden'); $('previewImg').removeAttribute('src');
  }

  $('fileIn').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var url = URL.createObjectURL(f);
    var img = new Image();
    img.onload = function () {
      // Shrink large photos so they send quickly
      var max = 1280, w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.round(w * scale); c.height = Math.round(h * scale);
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      pendingPic = c.toDataURL('image/jpeg', 0.8);
      URL.revokeObjectURL(url);
      $('previewImg').src = pendingPic;
      $('preview').classList.remove('hidden');
      $('status').textContent = '';
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      $('status').textContent = 'That picture could not be opened. Try another one.';
    };
    img.src = url;
  });

  // ---------- Start: open straight into the saved chat ----------
  (function () {
    var n = load('chatName'), p = load('chatPass');
    if (!(n && p)) { showLogin(API ? '' : 'The app link is not set yet. Put your /exec link in config.js.'); return; }
    me = n; pass = p;
    openChat();
    resetList();
    var saved = null;
    try { saved = JSON.parse(load('chatCache') || 'null'); } catch (e) {}
    if (saved && saved.items && saved.items.length) {
      addMessages({ items: saved.items, last: saved.last, status: { delivered: saved.d, seen: saved.s } }, true);
      startPolling();
      poll();
    } else {
      api('getMessages', { pass: p, after: 0, name: n, seen: 0 }).then(function (res) {
        addMessages(res, true);
        startPolling();
      }).catch(function (err) {
        if (isWrongPass(err)) signOut('The passcode has changed. Please sign in again.');
        else { $('status').textContent = 'Connection problem. Trying again…'; lastRow = 0; startPolling(); }
      });
    }
  })();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
